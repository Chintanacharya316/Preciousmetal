name: Daily prices & deploy

on:
  schedule:
    - cron: "17 2 * * *"   # every day at 02:17 UTC, after the daily FX/metals snapshot is published
  workflow_dispatch:        # "Run workflow" button for a manual refresh
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch today's prices (and fill any missed days)
        if: github.event_name != 'push'
        run: node scripts/update-prices.mjs

      - name: Test data pipeline and validate the new prices
        run: node --test tests/*.test.mjs

      - name: Commit updated price history
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- data/prices.json; then
            echo "No price changes."
          else
            git config user.name "aurum-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prices.json
            git commit -m "data: daily prices $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
